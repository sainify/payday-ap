name: Apply PAYDAY AI Expense Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check upgrade ZIP
        run: |
          test -f payday-ap-ai-expense-scanner-updated.zip || {
            echo "payday-ap-ai-expense-scanner-updated.zip not found"
            exit 1
          }

      - name: Inspect ZIP
        run: |
          unzip -l payday-ap-ai-expense-scanner-updated.zip | head -50

      - name: Extract upgrade
        run: |
          rm -rf /tmp/payday-upgrade
          mkdir -p /tmp/payday-upgrade
          unzip -q payday-ap-ai-expense-scanner-updated.zip -d /tmp/payday-upgrade

          ROOT="$(find /tmp/payday-upgrade -mindepth 1 -maxdepth 1 -type d | head -1)"

          if [ -d "$ROOT/frontend" ] && [ -d "$ROOT/worker" ]; then
            rm -rf ./frontend ./worker
            cp -a "$ROOT/frontend" ./frontend
            cp -a "$ROOT/worker" ./worker
          else
            echo "Could not find frontend and worker folders in ZIP"
            find /tmp/payday-upgrade -maxdepth 3 -type d
            exit 1
          fi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-package-lock
          npm run build

      - name: Typecheck Worker
        working-directory: worker
        run: |
          npm install --no-package-lock
          npx tsc --noEmit

      - name: Clean generated files
        run: |
          rm -rf frontend/node_modules frontend/dist
          rm -rf worker/node_modules worker/dist
          rm -f frontend/package-lock.json
          rm -f worker/package-lock.json
          rm -f payday-ap-ai-expense-scanner-updated.zip

      - name: Commit PAYDAY AI Scanner
        run: |
          git config user.name "PAYDAY Upgrade Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add PAYDAY AI Expense Scanner"
          git push origin main

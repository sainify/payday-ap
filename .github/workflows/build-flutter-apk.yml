name: Build PAYDAY Flutter Android app
on:
  workflow_dispatch:
  push:
    branches: [migration/flutter-native]
    paths:
      - 'flutter_app/**'
      - 'scripts/enable-android-desugaring.py'
      - '.github/workflows/build-flutter-apk.yml'
permissions:
  contents: read
jobs:
  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test
      - name: Generate Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.sainify .
      - name: Enable Android core library desugaring
        run: python3 scripts/enable-android-desugaring.py
      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug --dart-define=PAYDAY_API_URL=https://payday-ap.pages.dev
      - uses: actions/upload-artifact@v4
        with:
          name: payday-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

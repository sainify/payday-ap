name: Build and deploy PAYDAY Android app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "worker/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Worker dependencies
        run: npm install
      - name: Typecheck Worker
        run: npm run typecheck

  build-android:
    runs-on: ubuntu-latest
    needs: verify-worker
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Deploy the exact frontend that the APK opens
        if: github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy dist --project-name payday-ap --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create Android project
        run: npx cap add android
      - name: Install PAYDAY native biometric and home-screen widget components
        run: node ../scripts/patch-android.mjs
      - name: Sync Android plugins and assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload PAYDAY APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDAY-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build PAYDAY Android app (React + Capacitor)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "worker/**"
      - "scripts/patch-android.mjs"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Worker dependencies
        run: npm install
      - name: Typecheck Worker
        run: npm run typecheck

  build-android:
    needs: verify-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install frontend dependencies
        run: npm install
      - name: Build bundled React app for the native Android WebView
        run: npm run build
        env:
          VITE_API_BASE: https://payday-ap.sainify.workers.dev/api
      - name: Create Android project
        run: npx cap add android
      - name: Install PAYDAY native biometric, cookie and home-screen widget components
        run: node ../scripts/patch-android.mjs
      - name: Sync Android plugins and assets
        run: npx cap sync android
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload PAYDAY APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDAY-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
